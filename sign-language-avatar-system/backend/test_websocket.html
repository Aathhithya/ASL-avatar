<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Module 2 — WebSocket Test</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b0f14;
      color: #e8edf2;
      padding: 30px;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #223040;
      background: #131a22;
      color: #e8edf2;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #1b8f84;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    #status {
      margin: 14px 0;
      font-size: 14px;
      color: #8ea0af;
    }

    #status.connected {
      color: #2ec4b6;
    }

    pre {
      background: #131a22;
      border: 1px solid #223040;
      border-radius: 10px;
      padding: 16px;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <h1>Module 2 — Backend Gateway WebSocket Test</h1>
  <div id="status">Connecting to http://localhost:5000 ...</div>

  <input id="textInput" type="text" placeholder="Type a sentence, e.g. Hello there" value="Hello there" />
  <button onclick="sendText()">Send</button>

  <h3>Response from server:</h3>
  <pre id="output">(nothing sent yet)</pre>

  <script>
    const socket = io("http://localhost:5000");
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");

    socket.on("connect", () => {
      statusEl.textContent = "Connected to backend (Module 2 is running)";
      statusEl.className = "connected";
    });

    socket.on("disconnect", () => {
      statusEl.textContent = "Disconnected -- is app.py still running?";
      statusEl.className = "";
    });

    socket.on("sign_sequence", (result) => {
      outputEl.textContent = JSON.stringify(result, null, 2);
    });

    function sendText() {
      const text = document.getElementById("textInput").value;
      if (!text.trim()) return;
      socket.emit("speech_text", { text, isFinal: true });
    }

    document.getElementById("textInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendText();
    });
  </script>
</body>

</html>
